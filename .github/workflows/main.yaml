name: Main Workflow 
on: push

jobs:
  build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v5
          with:
            fetch-depth: 0

        - name: Fixing the release version
          id: release_version
          uses: ./.github/actions/next_release_number

        - run: "echo ${{ steps.release_version.outputs.version }}"

        - name: Login to GHCR.IO
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Build Docker Image
          uses: docker/build-push-action@v6
          with:
            context: .
            push: false
            tags: medkhabt/planar-emb-from-two-sat/app:${{ steps.release_version.outputs.version }}
          env:
            DOCKER_BUILD_RECORD_RETENTION_DAYS: 1
