name: Main Workflow
on: push

jobs:
  build:
      runs-on: ubuntu-latest
      outputs:
        version: ${{ steps.release_version.outputs.version }}
      steps:
        - uses: actions/checkout@v5
          with:
            fetch-depth: 0

        - name: Fixing the release version
          id: release_version
          uses: ./.github/actions/next_release_number

        - run: "echo ${{ steps.release_version.outputs.version }}"

        - name: Login to GHCR.IO
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Build Docker Image
          uses: docker/build-push-action@v6
          with:
            context: .
            push: false
            tags: medkhabt/planar-emb-from-two-sat:${{ steps.release_version.outputs.version }}
            outputs: type=docker,dest=${{ runner.temp }}/main_image.tar
          env:
            DOCKER_BUILD_RECORD_UPLOAD: false

        - name: Upload artifact
          uses: actions/upload-artifact@v4
          with:
            name: main_image
            path: ${{ runner.temp }}/main_image.tar
            retention-days: 1


  push:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write
    # TODO: remove comment test
    #if: github.ref == 'refs/heads/main'
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Login to GHCR.IO
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download docker artifact PLANAR-EMB-FROM-TWO-SAT from the build step
        uses: actions/download-artifact@v5
        with:
          name: main_image
          path: ${{ runner.temp }}

      - name: Push to GHCR
        run: |
          docker load --input ${{ runner.temp }}/main_image.tar
          IMAGE_NAME="medkhabt/planar-emb-from-two-sat"

          docker tag $IMAGE_NAME:$VERSION ghcr.io/$IMAGE_NAME:$VERSION && docker push ghcr.io/$IMAGE_NAME:$VERSION
          docker tag $IMAGE_NAME:$VERSION ghcr.io/$IMAGE_NAME:latest && docker push ghcr.io/$IMAGE_NAME:latest

  create_release:
    runs-on: ubuntu-latest
    needs: [build, push]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Create new release tag
        run: |
          git tag $VERSION
          git push origin $VERSION
      - name: Create a Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.build.outputs.version }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build, push]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Login to GHCR.IO
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            docker image pull ghcr.io/$IMAGE_NAME:latest
            docker stop thesis-api 2>/dev/null || true
            docker rm thesis-api 2>/dev/null || true
            docker run --rm -p 8087:8087 --name api_thesis ghcr.io/$IMAGE_NAME:latest 
